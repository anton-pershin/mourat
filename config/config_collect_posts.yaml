defaults:
  - _self_
  - user_settings: user_settings
  - hydra: base
  - monitoring_handler: via_md_files
  - llm/caila_glm_5_3_flash@scoring_llm
  - llm/caila_glm_5_3_flash@enrichment_llm
  - llm/caila_glm_5_3_flash@classification_llm
  - collector: reddit
  - slop_filter: default

project_path: ${user_settings.project_path}
result_dir: ${user_settings.result_dir}
hydra_root: ${user_settings.hydra_root}
hydra_dir: ${user_settings.hydra_dir}
db_path: ${user_settings.db_path}

# Enricher
enricher:
  _target_: mourat.enrichers.web_enricher.WebEnricher
  _partial_: true  # expect positional arguments: monitoring_handler, model
  system_prompt: ${enrichment.system_prompt}
  model_settings:
    timeout: ${enrichment.agent.timeout}
  retries: ${enrichment.agent.retries}
  request_limit: 20
  tool_calls_limit: 10

# Scorer
scorer:
  _target_: mourat.processors.post_scorer.PostScorer
  _partial_: true  # expect positional arguments: monitoring_handler, model
  rq_list: ${scoring.rq_list}
  tc_list: ${scoring.tc_list}
  topic_list: ${scoring.topic_list}
  system_prompt: ${scoring.system_prompt}
  model_settings:
    timeout: ${scoring.agent.timeout}
  retries: ${scoring.agent.retries}

# Slop classifier
slop_classifier:
  _target_: mourat.classifiers.PostSlopClassifier
  _partial_: true  # expect positional arguments: monitoring_handler, model
  batch_size: 20
  max_text_chars: 800
  model_settings:
    timeout: ${slop_classification.agent.timeout}
  retries: ${slop_classification.agent.retries}

# Slop verdict filter
slop_verdict_filter:
  _target_: mourat.filters.SlopFilter
  _partial_: true  # expect positional argument: monitoring_handler

# Score filter
score_filter:
  _target_: mourat.filters.PostScoreFilter
  _partial_: true  # expect positional argument: monitoring_handler
  score_threshold: ${scoring.min_score}

# Component configs
enrichment:
  system_prompt: |
    You are a research assistant helping to enrich social media posts with additional context.

    For each post provided, your task is to:
    1. Determine if the post needs enrichment (e.g., post mentioning a topic that needs more context)
    2. If enrichment is needed, use the available tools to gather self-contained facts obtained from the web that are NOT already evident in the post:
       - `extract_url`: Fetch and extract the full content of an URL.
       - `web_search`: Find related information online.
    3. Return a list of additional context points based on the collected self-contained facts. Each point must stand alone, phrased like "X is ...".
    4. If no enrichment is needed or the web search and web-page fetch yield nothing new, return an empty list.

    Be concise and focused. Only enrich posts that genuinely need it.

    Note that you have strict tool usage limits: one `web_search` call and three `extract_url` calls.
    Be frugal and smart in your choices and do not attempt to bypass these limits.
  agent:
    timeout: 300
    retries: 3

scoring:
  system_prompt: >
    You are a research relevance scorer. Score each post against the given RQs, TCs, and topics (0-100).
  rq_list: []
  tc_list: []
  topic_list: []
  min_score: 50
  agent:
    timeout: 300
    retries: 3

slop_classification:
  agent:
    timeout: 120
    retries: 3
