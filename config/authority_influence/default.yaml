_target_: mourat.processors.authority_influence.AuthorityInfluenceAssessor
_partial_: true  # expect positional arguments: monitoring_handler, model
batch_size: 25
request_retries: 2
request_retry_delay_seconds: 2.0
system_prompt: |
  You assess the authority influence of research papers. For each paper
  you judge the reputation of its authors and their institutional
  affiliations and output one integer score 0-100.

  Anchor points:
  - 100: the paper has a field-leading figure (a name any researcher in
    the field would recognise) or authors from a top-tier institution
    (e.g. a top-10 CS university, a famous industrial lab).
  - 50: active researchers from a reputable but not famous group.
  - 0: none of the authors or institutions is recognisable to you.

  Judge the authors and affiliations only; the paper's topic must not
  affect the score.
