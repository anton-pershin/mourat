[project]
name = "mourat"
description = "LLM-based tool for paper collection and review"
dynamic = ["version"]
authors = [
  {name = "Anton Pershin", email = "tony.pershin@gmail.com"},
]
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
  "hydra-core >= 1.3",
  "praw >= 7.7.0",
  "rich >= 14.0.0",
  "feedparser",
  "httpx",
  "requests",
  "PySocks",  # SOCKS proxies need it; requests reports a missing import
  "beautifulsoup4",
  "trafilatura",
  "pydantic",
  "pydantic-ai >= 2.64.0",
  # Reviewed enrichment and article contracts from Comourat PRs #12 and #13.
  "comourat @ git+https://github.com/anton-pershin/comourat.git@d82a29f87b858024615f8f56c4059c11b043bdd9"
]

[build-system]
requires = ["hatchling >= 1.26", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.targets.wheel]
packages = ["mourat"]

[tool.versioningit]
default-version = "0.0.0"

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_third_party = "hydra, rally"

[tool.pylint]
max-line-length = 88
min-similarity-lines = 12

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "missing-docstring",      # Disable docstring requirements
    "too-few-public-methods", # Allow classes with few methods
    "too-many-arguments",
    "too-many-positional-arguments",
    "wrong-import-order",     # Already addressed by isort
    "too-many-instance-attributes",
    "too-many-locals",
    "no-else-return",
    "too-many-return-statements",
    "redefined-builtin",
]

[tool.mypy]
disable_error_code = ["import-untyped"]
